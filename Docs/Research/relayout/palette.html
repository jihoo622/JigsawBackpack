<style>
  :root {

    z-index: 100;

    border-bottom: 1px solid var(--ui-border);
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    backdrop-filter: blur(8px);

  .brand h1 { font-size: 16px; font-weight: 800; color: var(--ui-gold); }
  .brand p { font-size: 12px; color: var(--ui-sub); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab-btn {
    background: var(--ui-card);
    color: var(--ui-sub);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--ui-text); border-color: #475569; }
  .tab-btn.active {
    background: rgba(240, 180, 41, 0.18);
    color: var(--ui-gold);
    border-color: var(--ui-gold);
  }
  .container {
    max-width: 1680px;
    margin: 0 auto;
    padding: 20px 24px 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 16px;
  }
  .card {
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    padding: 18px 20px;

    font-size: 16px;
    font-weight: 800;
    color: var(--ui-gold);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    font-size: 12px;
    font-weight: 700;
    color: #38bdf8;
    text-decoration: none;
    border: 1px solid rgba(56, 189, 248, 0.45);
    padding: 4px 10px;
    border-radius: 6px;

    display: grid;
    grid-template-columns: repeat(3, 1fr);

    margin-top: 8px;

    border: 1px solid var(--ui-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
  }

  .sim-strips { display: flex; flex-direction: column; gap: 10px; }

    border: 1px solid var(--ui-border);

    padding: 10px 12px;

    gap: 5px;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.14);

  .sim-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.25); }

    display: inline-grid;
    grid-template-columns: repeat(4, 9px);
    gap: 1px;
    padding: 3px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .mg-sq { width: 9px; height: 9px; border-radius: 1px; }

  /* Preview Grid */
  .preview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
    gap: 16px;
  }
  .preview-item {
    background: var(--ui-panel);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;

  .preview-head {

    border-bottom: 1px solid var(--ui-border);

    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;

  .iframe-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #05080d;
    overflow: hidden;
  }
  .iframe-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 1920px;
    height: 1080px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
  }

  .swatch-groups {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
    gap: 16px;
  }
  .swatch-table {
    width: 100%;

    font-size: 12px;

  .swatch-table th, .swatch-table td {

    text-align: left;

  .badge-pass {

        <div class="note-box"><b>리스크 (Risks)</b><span id="note-risks"></span></div>

  </section>
</main>

  function hexToRgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgbToHex(r, g, b) {
    const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
    return '#' + [clamp(r), clamp(g), clamp(b)].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  function srgbToLin(c) {
    c /= 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function linToSrgb(c) {
    c = Math.max(0, Math.min(1, c));
    return (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055) * 255;
  }
  function relLum(hex) {
    const [r, g, b] = hexToRgb(hex).map(srgbToLin);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function contrastRatio(h1, h2) {
    let l1 = relLum(h1), l2 = relLum(h2);
    if (l1 < l2) [l1, l2] = [l2, l1];
    return (l1 + 0.05) / (l2 + 0.05);
  }
  function toGrayscaleHex(hex) {
    const l = relLum(hex);
    const v = linToSrgb(l);
    return rgbToHex(v, v, v);
  }
  // Viénot et al. (1999) deuteranopia simulation in linear sRGB
  function toDeuteranopiaHex(hex) {
    const [r, g, b] = hexToRgb(hex).map(srgbToLin);
    const dr = 0.29275 * r + 0.70725 * g + 0.0 * b;
    const dg = 0.29275 * r + 0.70725 * g + 0.0 * b;
    const db = -0.02234 * r + 0.02234 * g + 1.0 * b;
    return rgbToHex(linToSrgb(dr), linToSrgb(dg), linToSrgb(db));
  }

  function findTokenHex(cand, tokenName) {
    for (const g of cand.groups) {
      for (const t of g.tokens) {
        if (t[0] === tokenName) return t[1];
      }
    }
    return '#888888';
  }

  let currentPalette = new URLSearchParams(window.location.search).get('palette') || 'a';
  if (!['a', 'b', 'c', 'd'].includes(currentPalette)) currentPalette = 'a';

  function renderCandidate(p) {
    currentPalette = p;
    const cand = CANDIDATES[p];
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.p === p));
    document.getElementById('cand-title').textContent = cand.title;
    document.getElementById('open-full-link').href = `concept-3b.html?palette=${p}`;
    document.getElementById('note-mood').textContent = cand.mood;
    document.getElementById('note-strengths').textContent = cand.strengths;
    document.getElementById('note-risks').textContent = cand.risks;

    // 1. Simulation strips (Original, Grayscale, Deuteranopia)
    const gold = findTokenHex(cand, '--gold');
    const pos = findTokenHex(cand, '--pos-soft');
    const neg = findTokenHex(cand, '--neg-soft');
    const warn = findTokenHex(cand, '--warn');
    const info = findTokenHex(cand, '--info');
    const tAbund = findTokenHex(cand, '--tier-abundant');
    const tPref = findTokenHex(cand, '--tier-preferred');
    const tRare = findTokenHex(cand, '--tier-rare');
    const mgBlk = findTokenHex(cand, '--mg-blocked');
    const mgEmp = findTokenHex(cand, '--mg-empty');
    const mgC0 = findTokenHex(cand, '--mg-cargo-0');
    const mgC1 = findTokenHex(cand, '--mg-cargo-1');

    const simModes = [
      { label: '원본 (Original)', fn: x => x },
      { label: '그레이스케일 (Grayscale — 명도 구분 확인)', fn: toGrayscaleHex },
      { label: '적록색맹 (Deuteranopia — +/- Δ 및 등급 구분 확인)', fn: toDeuteranopiaHex }
    ];

    const stripsEl = document.getElementById('sim-strips');
    stripsEl.innerHTML = simModes.map(mode => {
      const bg = mode.fn(cand.panelHex);
      const items = [
        { name: '골드', hex: mode.fn(gold) },
        { name: '▲ +12$', hex: mode.fn(pos) },
        { name: '▼ -50%', hex: mode.fn(neg) },
        { name: '경고', hex: mode.fn(warn) },
        { name: '정보', hex: mode.fn(info) },
        { name: '풍부70%', hex: mode.fn(tAbund) },
        { name: '선호130%', hex: mode.fn(tPref) },
        { name: '희귀200%', hex: mode.fn(tRare) }
      ];
      const mgColors = [mgBlk, mgEmp, mgC0, mgC1].map(mode.fn);
      return `
        <div class="sim-row">
          <div class="sim-label">${mode.label}</div>
          <div class="sim-chips">
            ${items.map(it => `
              <span class="sim-chip" style="background:${bg};color:${it.hex};">
                <span class="sim-dot" style="background:${it.hex};"></span>${it.name}
              </span>
            `).join('')}
            <span class="mg-mini-preview" style="background:${bg};" title="9px 미니그리드: 막힘/빈칸/화물A/화물B">
              <span class="mg-sq" style="background:${mgColors[0]};"></span>
              <span class="mg-sq" style="background:${mgColors[1]};"></span>
              <span class="mg-sq" style="background:${mgColors[2]};"></span>
              <span class="mg-sq" style="background:${mgColors[3]};"></span>
            </span>
          </div>
        </div>
      `;
    }).join('');

    // 2. Live Preview Iframes
    const previewEl = document.getElementById('preview-grid');
    previewEl.innerHTML = KEY_STATES.map(st => `
      <div class="preview-item">
        <div class="preview-head">
          <span>${st.label}</span>
          <a href="concept-3b.html?palette=${p}&state=${st.id}" target="_blank">1920×1080 열기 ↗</a>
        </div>
        <div class="iframe-wrap">
          <iframe src="concept-3b.html?palette=${p}&state=${st.id}&embed=1" loading="lazy"></iframe>
        </div>
      </div>
    `).join('');
    scaleIframes();

    // 3. Swatch Groups + WCAG Ratios
    const swatchEl = document.getElementById('swatch-groups');
    swatchEl.innerHTML = cand.groups.map(g => `
      <div class="card" style="padding:14px 16px;">
        <h2 style="font-size:14px;margin-bottom:8px;">${g.name}</h2>
        <table class="swatch-table">
          <thead><tr><th>색</th><th>토큰</th><th>Hex</th><th>역할</th><th>패널 대비율</th></tr></thead>
          <tbody>
            ${g.tokens.map(([tok, hex, role, checkContrast]) => {
              let ratioHtml = '<span style="color:var(--ui-sub);">—</span>';
              if (checkContrast) {
                const rPanel = contrastRatio(hex, cand.panelHex);
                const rCard = contrastRatio(hex, cand.cardHex);
                const minR = Math.min(rPanel, rCard);
                const cls = minR >= 4.5 ? 'badge-pass' : (minR >= 3.0 ? 'badge-large' : 'badge-fail');
                const tag = minR >= 4.5 ? 'AA' : (minR >= 3.0 ? '3:1+' : '미달');
                ratioHtml = `<span class="${cls}">${rPanel.toFixed(1)} / ${rCard.toFixed(1)} (${tag})</span>`;
              }
              return `
                <tr>
                  <td><span class="swatch-box" style="background:${hex};"></span></td>
                  <td><code>${tok}</code></td>
                  <td><code>${hex}</code></td>
                  <td>${role}</td>
                  <td>${ratioHtml}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    `).join('');
  }

  function scaleIframes() {
    document.querySelectorAll('.iframe-wrap').forEach(wrap => {
      const iframe = wrap.querySelector('iframe');
      if (!iframe) return;
      const scale = wrap.clientWidth / 1920;
      iframe.style.transform = `scale(${scale})`;
    });
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => renderCandidate(btn.dataset.p));
  });
  window.addEventListener('resize', scaleIframes);
  renderCandidate(currentPalette);
